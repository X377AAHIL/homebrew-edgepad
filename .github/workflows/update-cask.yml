name: Update Cask

on:
  repository_dispatch:
    types: [update-cask]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without v prefix)'
        required: true
      sha256:
        description: 'SHA256 of the DMG'
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Cask formula
        run: |
          VERSION="${{ github.event.inputs.version || github.event.client_payload.version }}"
          SHA256="${{ github.event.inputs.sha256 || github.event.client_payload.sha256 }}"

          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/edgepad.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/edgepad.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/edgepad.rb
          git commit -m "Update EdgePad to ${VERSION}"
          git push
